<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#FF8FAB" />
    <meta name="description" content="Run a fast, cheerful ice cream stand one shift at a time. No ads, no lives, no timers, nothing to buy, no accounts, no cookies, nothing sold or shared. Works offline." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v2.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Scoopaloo</title>
  </head>
  <body>
    <main>
      <canvas id="game" width="960" height="640" tabindex="0" aria-label="Scoopaloo ice cream stand game"></canvas>
      <div id="shift-ui"></div>
      <nav id="bottom-nav" class="bottom-nav" aria-label="Game menu">
        <button id="play-button" class="nav-button" type="button" aria-current="page"><span aria-hidden="true">▶</span><b>PLAY</b></button>
        <button id="store-button" class="nav-button" type="button"><span aria-hidden="true">▦</span><b>STORE</b></button>
        <button id="save-button" class="nav-button" type="button" aria-label="Open save card"><span aria-hidden="true">◆</span><b>SAVE</b></button>
        <button id="about-button" class="nav-button" type="button"><span aria-hidden="true">ⓘ</span><b>ABOUT</b></button>
        <button id="sound-button" class="nav-button sound-button" type="button" aria-label="Sound" aria-pressed="true"><span aria-hidden="true">♪</span><b>SOUND</b></button>
      </nav>
      <button id="update-toast" class="round-button update-toast" hidden aria-label="Update ready, tap to refresh">↻</button>
      <dialog id="save-dialog" aria-labelledby="save-title">
        <form method="dialog"><button class="close" aria-label="Close">×</button></form>
        <div class="save-mark">◆</div>
        <h2 id="save-title">MOVE YOUR SAVE</h2>
        <p class="save-copy">SCAN THE CODE OR OPEN THE RESCUE LINK ON YOUR OTHER DEVICE.</p>
        <img id="save-qr" alt="QR code for this save" />
        <a id="rescue-link" target="_blank" rel="noopener">OPEN RESCUE LINK ↗</a>
      </dialog>
      <dialog id="about-dialog" class="about-dialog" aria-labelledby="about-title">
        <form method="dialog"><button class="close" aria-label="Close about">×</button></form>
        <h2 id="about-title">ABOUT</h2>
        <p class="about-copy">no ads, no lives, no timers, nothing to buy, no accounts, no cookies, nothing sold or shared. that is the whole point.</p>
        <p class="maker-mark">made with <svg aria-hidden="true" class="mark-heart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span class="sr-only">love</span> by
          <a href="https://royashbrook.com" target="_blank" rel="noreferrer">roy</a> +
          <a href="https://royashbrook.com/agents" target="_blank" rel="noreferrer">ai</a>
          <span aria-hidden="true" class="mark-dot">&middot;</span>
          <a href="https://github.com/sponsors/royashbrook" target="_blank" rel="noreferrer" class="mark-sponsor">sponsor me</a>
        </p>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
