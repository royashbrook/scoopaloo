<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#FF8FAB" />
    <meta name="description" content="Run a fast, cheerful ice cream stand one shift at a time." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Scoopaloo</title>
  </head>
  <body>
    <main>
      <canvas id="game" width="960" height="640" tabindex="0" aria-label="Scoopaloo ice cream stand game"></canvas>
      <div id="shift-ui"></div>
      <button id="save-button" class="round-button" aria-label="Open save card">◆</button>
      <button id="sound-button" class="round-button sound-button" aria-label="Sound" aria-pressed="true">♪</button>
      <button id="update-toast" class="round-button update-toast" hidden aria-label="Update ready, tap to refresh">↻</button>
      <dialog id="save-dialog" aria-labelledby="save-title">
        <form method="dialog"><button class="close" aria-label="Close">×</button></form>
        <div class="save-mark">◆</div>
        <h2 id="save-title">MOVE YOUR SAVE</h2>
        <p class="save-copy">SCAN THE CODE OR OPEN THE RESCUE LINK ON YOUR OTHER DEVICE.</p>
        <img id="save-qr" alt="QR code for this save" />
        <a id="rescue-link" target="_blank" rel="noopener">OPEN RESCUE LINK ↗</a>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
