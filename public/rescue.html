<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF8FAB">
  <title>Scoopaloo rescue</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;background:#FFD9B8;color:#4A3B45;font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif}main{width:min(28rem,calc(100vw - 2rem));padding:2rem;border:.3rem solid #4A3B45;border-radius:3rem;background:#FFF3E6;box-shadow:0 1rem 0 #FF8FAB;text-align:center}.cone{font-size:6rem;line-height:1}.arrow{font-size:3rem;color:#63CDB4}button,a{display:grid;place-items:center;width:6rem;height:6rem;margin:1rem auto;border:.25rem solid #4A3B45;border-radius:50%;background:#FFD45E;color:#4A3B45;font:700 3rem system-ui;text-decoration:none;box-shadow:0 .45rem 0 #4A3B45;cursor:pointer}button:active{transform:translateY(.3rem);box-shadow:0 .15rem 0 #4A3B45}.bad{filter:grayscale(1);opacity:.5}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <div class="cone">🍦</div>
    <div class="arrow">↓</div>
    <button id="restore" aria-label="Restore this save">✓</button>
    <a id="play" href="/" hidden aria-label="Play Scoopaloo">▶</a>
  </main>
  <script>
    const key='scoopaloo_save_v1',prefix='sc1.'
    const button=document.querySelector('#restore'),play=document.querySelector('#play')
    async function decode(code){
      if(!code.startsWith(prefix))throw Error('bad code')
      const value=code.slice(prefix.length).replaceAll('-','+').replaceAll('_','/')
      const raw=atob(value.padEnd(Math.ceil(value.length/4)*4,'='))
      const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0))
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
      const save=JSON.parse(await new Response(stream).text())
      if(save.version!==1||!Number.isFinite(save.coins)||!Array.isArray(save.unlockedStations))throw Error('bad save')
      save.text=false
      return save
    }
    if(!location.hash.startsWith('#'+prefix)){button.disabled=true;button.classList.add('bad')}
    button.addEventListener('click',async()=>{
      try{
        const save=await decode(location.hash.slice(1))
        localStorage.setItem(key,JSON.stringify(save))
        button.hidden=true
        play.hidden=false
      }catch{button.disabled=true;button.classList.add('bad')}
    })
  </script>
</body>
</html>
